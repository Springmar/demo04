<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>节假日管理</title>
    <style>
        .calendar {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .calendar td, .calendar th {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            width: 14.2%; /* 100 / 7 */
        }
        .other-month { color: #ddd; } /* 非当月日期变灰 */
        .holiday { background-color: #ffcccc; } /* 节假日标红 */
        .workday { background-color: #ccffcc; } /* 工作日标绿 */
        .today { border: 2px solid gold; } /* 今天高亮 */

        /* 导航区域样式 */
        .navigation {
            text-align: center;
            margin: 20px 0;
            font-size: 18px;
        }

        /* 下拉框和按钮的样式 */
        select, button {
            padding: 5px 10px;
            margin: 0 5px;
            font-size: 16px;
        }
    </style>
</head>
<body>
<h1 th:text="|节假日管理 - | + ${currentYear} + '年' + ${currentMonth} + '月'" style="text-align: center;"></h1>

<div class="navigation">

    <!-- 下拉选择器 -->
    <select id="yearSelect" onchange="jumpToDate()">
        <!-- 生成最近10年和未来10年的选项 -->
        <option th:each="y : ${#numbers.sequence(currentYear - 10, currentYear + 10)}"
                th:value="${y}"
                th:text="${y} + '年'"
                th:selected="${y == currentYear}">
        </option>
    </select>

    <select id="monthSelect" onchange="jumpToDate()">
        <option th:each="m : ${#numbers.sequence(1, 12)}"
                th:value="${m}"
                th:text="${m} + '月'"
                th:selected="${m == currentMonth}">
        </option>
    </select>

</div>

<table class="calendar">
    <thead>
    <tr>
        <th>周日</th><th>周一</th><th>周二</th>
        <th>周三</th><th>周四</th><th>周五</th><th>周六</th>
    </tr>
    </thead>
    <tbody>


    <!-- 遍历周 -->
    <tr th:each="week : ${calendar}">
        <!-- 遍历天 -->
        <td th:each="day : ${week}"
            th:class="|${day.date == #temporals.createNow().toLocalDate() ? 'today' : ''}
               ${day.isHoliday ? 'holiday' : 'workday'}
               ${not day.currentMonth ? 'other-month' : ''}|">
<!--            <div th:text="${day?.date != null} ? ${#temporals.dayOfMonth(day.date)} : ''">1</div>-->
            <div th:text="${day?.date} ?: ''">1</div>
            <!-- 点击切换按钮 -->
            <button th:if="${day.currentMonth}"
                    th:attr="data-date=${day.date}"
                    th:onclick="location.href='/holiday/toggle?date=' + this.getAttribute('data-date')"
                    style="margin-top: 5px; padding: 2px 5px;">
                <span th:text="${day.isHoliday} ? '设为工作日' : '设为休息日'">${day.date}}</span>
            </button>
        </td>
    </tr>
    </tbody>
</table>

<div style="text-align: center; margin-top: 30px;">
    <a th:href="@{/}" style="text-decoration: none; color: #007bff;">返回首页</a>
</div>

<script>
    function jumpToDate() {
        // 获取用户选择的年份和月份
        var year = document.getElementById('yearSelect').value;
        var month = document.getElementById('monthSelect').value;

        // 构建跳转 URL (这里假设你的访问路径是 /holiday/view)
        // 注意：URL 中的参数名 (year, month) 需要与后端接收的参数名一致
        var url = '/holiday/view?year=' + year + '&month=' + month;

        // 执行跳转
        window.location.href = url;
    }
</script>

</body>
</html>
