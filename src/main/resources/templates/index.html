<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>学生值日系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center">🎓 学生值日管理系统</h1>

    <!-- 随机抽取结果展示 -->
    <div class="text-center my-4 p-4 bg-light rounded">
        <h2>今日值日生</h2>

        <!-- 情况1：如果今天是休息日 -->
        <div th:if="${isTodayHoliday}">
            <h4 class="text-muted">
                <i class="bi bi-sun"></i> 今天休息
            </h4>
            <p class="text-success">
                下一位值日生：
                <span class="fw-bold" th:text="${dutyName}">张三</span>
                (负责 <span th:text="${#temporals.format(dutyDate, 'MM月dd日')}">01月01日</span>)
            </p>
        </div>

        <!-- 情况2：如果今天是工作日 -->
        <div th:unless="${isTodayHoliday}">
            <h1 class="display-1 text-primary fw-bold" th:text="${dutyName}">
                张三
            </h1>
        </div>
    </div>
    <!-- 添加学生表单 -->
    <div class="card mb-4">
        <div class="card-body">
            <h5>添加新学生</h5>
            <form th:action="@{/add}" th:object=" ${newStudent}" method="post">
                <div class="row g-3">

                    <div class="col-auto">
                        <input type="text" th:field="*{name}" class="form-control" placeholder="姓名" required>
                    </div>
                    <div class="col-auto">
                        <input type="text" th:field="*{className}" class="form-control" placeholder="班级" required>
                    </div>
                    <div class="col-auto">
                        <input type="text" th:field="*{studentID}" class="form-control" placeholder="学号" required>
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary">添加</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- 学生列表表格 -->
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>序号</th>
                <th>姓名</th>
                <th>班级</th>
                <th>学号</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <!-- Thymeleaf 遍历后端传来的 students 列表 -->
            <tr th:each="student :  ${students}">
                <td th:text=" ${student.id}">1</td>
                <td th:text=" ${student.name}">张三</td>
                <td th:text=" ${student.className}">高三一班</td>
                <td th:text=" ${student.studentID}">112233</td>
<!--                <td th:text=" ${student.dutyTime}">高三一班</td>-->
                <td>
                    <!-- 删除按钮，携带ID参数 -->
                    <a th:href="@{'/delete/' +  ${student.id}}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('确定删除？')">删除</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <!-- 分页组件 -->
    <div th:if="${totalPages > 1}" class="mt-4">
        <nav aria-label="Page navigation">
            <ul class="pagination justify-content-center">

                <!-- 上一页按钮 -->
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/(page=${currentPage - 1}, size=${size})}"
                       th:if="${currentPage > 0}">上一页</a>
                </li>

                <!-- 页码列表 -->
                <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    class="page-item"
                    th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link"
                       th:href="@{/(page=${i}, size=${size})}"
                       th:text="${i + 1}">1</a>
                </li>

                <!-- 下一页按钮 -->
                <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/(page=${currentPage + 1}, size=${size})}"
                       th:if="${currentPage < totalPages - 1}">下一页</a>
                </li>
            </ul>
        </nav>

        <!-- 显示统计信息 -->
        <p class="text-muted text-center">
            共 <span th:text="${totalElements}">100</span> 条记录,
            每页显示 <span th:text="${size}">5</span> 条,
            当前第 <span th:text="${currentPage + 1}">1</span> 页
        </p>
    </div>

</div>
</body>
</html>
